apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-task-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-task-tracker
  template:
    metadata:
      labels:
        app: student-task-tracker
    spec:
      containers:
      - name: student-task-tracker
        image: IMAGE_PLACEHOLDER
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 20
